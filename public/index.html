<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git 项目管家</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='none' stroke='%23252525' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='2.5' fill='%23252525'/%3E%3Cline x1='13' y1='8' x2='16' y2='8' stroke='%23252525' stroke-width='2'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  <script src="./assets/theme.js"></script>
  <script>
    // 在 React 挂载前应用主题，避免闪白。
    (function () {
      var scale = Number(localStorage.getItem('gpm-font') || '100');
      document.documentElement.style.setProperty('--ui-scale', [100, 110, 125].includes(scale) ? scale / 100 : 1);
      var radius = Number(localStorage.getItem('gpm-radius') || '4');
      document.documentElement.style.setProperty('--ui-radius', [2, 4, 6, 10].includes(radius) ? radius + 'px' : '4px');
    })();
  </script>
  <div id="app"></div>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
